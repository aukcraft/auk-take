name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dependency-direction guard: core purity + platform/ui package
      # direction rules (spec: host-shell). Replaces the inline 0a guard.
      - name: Dependency direction guard
        run: node scripts/dep-guard.cjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck (includes moduleSuffixes consistency via tsc configs)
        run: pnpm typecheck

      - name: Test
        run: pnpm test
